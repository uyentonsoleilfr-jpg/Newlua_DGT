<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Circular soft badge background -->
  <defs>
    <linearGradient id="riceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
  </defs>
  
  <!-- Premium Dark Emerald Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Left Rice Leaf -->
  <path d="M 32 54 C 26 44 14 36 10 24 C 18 25 26 33 32 44 Z" fill="url(#leafGreen)"/>
  
  <!-- Right Rice Leaf -->
  <path d="M 32 54 C 36 42 46 32 54 26 C 48 31 40 40 32 48 Z" fill="url(#leafGreen)" opacity="0.9"/>

  <!-- Central Stem -->
  <path d="M 32 56 Q 32 32 30 14" fill="none" stroke="#FCD34D" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Golden Rice Grains (Bông lúa uốn trĩu hạt) -->
  <!-- Top Grain -->
  <ellipse cx="29" cy="13" rx="3.2" ry="5.5" transform="rotate(-15 29 13)" fill="url(#riceGold)"/>
  <!-- Pair 1 -->
  <ellipse cx="24" cy="18" rx="3.5" ry="6" transform="rotate(-40 24 18)" fill="url(#riceGold)"/>
  <ellipse cx="35" cy="17" rx="3.5" ry="6" transform="rotate(35 35 17)" fill="url(#riceGold)"/>
  <!-- Pair 2 -->
  <ellipse cx="23" cy="25" rx="3.8" ry="6.5" transform="rotate(-45 23 25)" fill="url(#riceGold)"/>
  <ellipse cx="37" cy="24" rx="3.8" ry="6.5" transform="rotate(40 37 24)" fill="url(#riceGold)"/>
  <!-- Pair 3 -->
  <ellipse cx="24" cy="32" rx="3.8" ry="6.5" transform="rotate(-50 24 32)" fill="url(#riceGold)"/>
  <ellipse cx="38" cy="31" rx="3.8" ry="6.5" transform="rotate(45 38 31)" fill="url(#riceGold)"/>
  <!-- Pair 4 -->
  <ellipse cx="26" cy="39" rx="3.5" ry="6" transform="rotate(-45 26 39)" fill="url(#riceGold)"/>
  <ellipse cx="38" cy="38" rx="3.5" ry="6" transform="rotate(40 38 38)" fill="url(#riceGold)"/>
</svg>